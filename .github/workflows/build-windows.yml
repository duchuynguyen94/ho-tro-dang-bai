name: build-windows

# Chỉ build khi bấm tay (tránh build .exe mỗi lần sửa code).
# Vào GitHub → Actions → build-windows → Run workflow để build.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản phát hành (vd 0.2.0) — để trống nếu chỉ build thử"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"      # giống bản macOS (3.13.8)

      - name: Ghi số phiên bản vào app
        if: ${{ inputs.version != '' }}
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          (Get-Content app/__init__.py) -replace '__version__ = ".*"', "__version__ = `"$v`"" | Set-Content app/__init__.py
          Select-String -Path app/__init__.py -Pattern __version__

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Kiểm tra ứng dụng khởi động (smoke test)
        env:
          QT_QPA_PLATFORM: offscreen
          HTDB_DATA_DIR: ${{ runner.temp }}\htdb_smoke
        run: python -c "from app.ui.main_window import MainWindow; from PySide6.QtWidgets import QApplication; a=QApplication([]); w=MainWindow(); print('OK', w.stack.count())"

      # KHÔNG kèm Chromium: app dùng Google Chrome có sẵn trên máy (gói nhẹ)
      - name: Build .exe (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed
          --add-data "app/assets;app/assets"
          --name HoTroDangBai
          --collect-all playwright
          --hidden-import app
          --hidden-import pypdf
          --exclude-module PySide6.Qt3DCore
          --exclude-module PySide6.Qt3DRender
          --exclude-module PySide6.Qt3DAnimation
          --exclude-module PySide6.Qt3DExtras
          --exclude-module PySide6.Qt3DInput
          --exclude-module PySide6.Qt3DLogic
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtWebEngineQuick
          --exclude-module PySide6.QtCharts
          --exclude-module PySide6.QtDataVisualization
          --exclude-module PySide6.QtGraphs
          --exclude-module PySide6.QtGraphsWidgets
          --exclude-module PySide6.QtMultimedia
          --exclude-module PySide6.QtMultimediaWidgets
          --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtQuick3D
          --exclude-module PySide6.QtQuickControls2
          --exclude-module PySide6.QtQuickWidgets
          --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtDesigner
          --exclude-module PySide6.QtSql
          --exclude-module PySide6.QtTest
          --exclude-module PySide6.QtBluetooth
          --exclude-module PySide6.QtNfc
          --exclude-module PySide6.QtLocation
          --exclude-module PySide6.QtPositioning
          --exclude-module PySide6.QtSensors
          --exclude-module PySide6.QtSerialPort
          --exclude-module PySide6.QtSerialBus
          --exclude-module PySide6.QtWebSockets
          --exclude-module PySide6.QtWebChannel
          --exclude-module PySide6.QtHelp
          --exclude-module PySide6.QtPdf
          --exclude-module PySide6.QtPdfWidgets
          --exclude-module PySide6.QtTextToSpeech
          --exclude-module PySide6.QtStateMachine
          --exclude-module PySide6.QtRemoteObjects
          --exclude-module PySide6.QtScxml
          --exclude-module PySide6.QtSpatialAudio
          --exclude-module PySide6.QtUiTools
          --exclude-module PySide6.QtHttpServer
          --exclude-module PySide6.QtNetworkAuth
          main.py

      - name: Đóng gói zip
        shell: pwsh
        run: Compress-Archive -Path dist/HoTroDangBai/* -DestinationPath HoTroDangBai-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HoTroDangBai-windows
          path: HoTroDangBai-windows.zip
          if-no-files-found: error

      - name: Tạo Release (để máy Windows bấm "Cập nhật ngay" là xong)
        if: ${{ inputs.version != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "v${{ inputs.version }}" HoTroDangBai-windows.zip
          --title "v${{ inputs.version }}"
          --notes "Bản phát hành v${{ inputs.version }}. Máy Windows: mở Cài đặt - Cập nhật phần mềm - bấm Cập nhật ngay."
