<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="tee" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#d5dde7"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0.18"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="600" cy="672" rx="330" ry="46" fill="#0f172a" opacity="0.16" filter="url(#soft)"/>

  <!-- T-shirt -->
  <path d="M452 196
           C 500 176, 540 214, 600 214
           C 660 214, 700 176, 748 196
           L 892 268
           L 842 392
           L 772 356
           L 772 632
           C 700 660, 500 660, 428 632
           L 428 356
           L 358 392
           L 308 268 Z"
        fill="url(#tee)" stroke="#b7c2d0" stroke-width="3"/>

  <!-- collar -->
  <path d="M520 202 C 556 250, 644 250, 680 202"
        fill="none" stroke="#a9b6c6" stroke-width="7" stroke-linecap="round"/>
  <path d="M520 202 C 556 250, 644 250, 680 202"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- sleeve seams -->
  <path d="M428 356 L428 300" stroke="#c3ccd8" stroke-width="2" fill="none"/>
  <path d="M772 356 L772 300" stroke="#c3ccd8" stroke-width="2" fill="none"/>

  <!-- soft folds -->
  <path d="M470 470 C 500 500, 520 560, 505 626" stroke="#cbd5e1" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M720 470 C 700 505, 690 560, 700 628" stroke="#cbd5e1" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M600 300 C 590 400, 610 500, 600 640" stroke="#e2e8f0" stroke-width="3" fill="none" opacity="0.9"/>

  <!-- chest logo -->
  <g transform="translate(600 392)">
    <circle r="26" fill="#2563eb"/>
    <path d="M-11 6 L0 -14 L11 6 Z" fill="#ffffff"/>
    <text x="0" y="52" text-anchor="middle" font-family="system-ui,Segoe UI,Roboto,sans-serif"
          font-size="20" font-weight="700" fill="#334155" letter-spacing="2">SITEA</text>
  </g>

  <rect width="1200" height="800" fill="url(#vig)"/>
</svg>
