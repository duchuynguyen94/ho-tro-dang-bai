  <g transform="translate(740,540) scale(1.35)"><use href="#clamp"/></g>

  <rect x="0" y="980" width="1080" height="100" fill="url(#bar)"/>
  <g transform="translate(58,1002)">
    <path d="M10 0 C4 0 0 4 0 10 c0 16 18 34 34 34 6 0 10-4 10-10 v-6 a3 3 0 0 0-2-3 l-8-3 a3 3 0 0 0-3 0 l-4 4 c-4-2-9-7-12-12 l4-4 a3 3 0 0 0 0-3 l-3-8 a3 3 0 0 0-3-2 z" fill="#ffffff" transform="scale(1.4)"/>
